# Builds the emulator and the titan_firmware_rs images (with the compiler titan_firmware_rs pins in its
# rust-toolchain.toml), then runs every test: the emulator's own, a smoke test for
# every board image, the robot, IVC link and sweep tests, Puddles over UDP, and the YAML scenarios in scenarios/.
#
# Both submodules are public (osu-uwrt/titan_firmware, ATK422/titan_firmware_rs), so no secrets are needed. Every job
# needs external/titan_firmware_rs: the emulator's workspace uses its host crates (canmore, titan_link).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The emulator's toolchain, pinned so that a new stable release (and its new clippy lints) can't turn CI red by
  # itself; bump it on purpose. The firmware images use titan_firmware_rs's own pin (its rust-toolchain.toml).
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Submodules
        run: |
          git submodule update --init external/titan_firmware
          # gen_boards.py --check reads the CANmore client IDs from titan_firmware's titan_canmore submodule (not its
          # pico-sdk, which only the c-firmware job needs)
          git -C external/titan_firmware submodule update --init lib/titan_canmore
          git submodule update --init external/titan_firmware_rs

      - name: Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup target add thumbv6m-none-eabi
          # The firmware builds with the compiler titan_firmware_rs pins (its rust-toolchain.toml, read by rustup in
          # that directory): install it and its target, so the images are the same build as everyone else's
          if [ -f external/titan_firmware_rs/rust-toolchain.toml ]; then
            (cd external/titan_firmware_rs && rustup toolchain install)
            FW_TOOLCHAIN=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' external/titan_firmware_rs/rust-toolchain.toml)
            rustup target add thumbv6m-none-eabi --toolchain "$FW_TOOLCHAIN"
            (cd external/titan_firmware_rs/firmware && rustc --version)
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            external/titan_firmware_rs/firmware

      - name: Firmware images
        run: |
          test -f external/titan_firmware_rs/firmware/Cargo.toml
          cd external/titan_firmware_rs/firmware && cargo build --workspace --release

      - name: Format and lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --release -- -D warnings
          python3 scripts/gen_boards.py --check

      - name: Tests
        run: cargo test --release --workspace -- --nocapture 2>&1 | tee test.log

      - name: Smoke test and sweep tables
        if: always()
        run: grep -E "^(board|[a-z_0-9]+ +[0-9n]|IVC| +[0-9]+ m )" test.log || true

      # The YAML scenarios (docs/scenarios.md) also ran in `cargo test`; here the command writes their JUnit XML
      - name: Scenarios
        if: always()
        run: |
          cargo build --release
          target/release/firmware_simulator scenario scenarios/ --junit scenarios.xml --quiet

      - name: Scenario results (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-junit
          path: scenarios.xml
          if-no-files-found: ignore

  macos:
    # The emulator also builds and runs natively on macOS (Apple silicon). SocketCAN (vcan, titan_bridge) is Linux
    # only: there, opening an interface reports that, and CAN reaches a Linux machine through `can-tunnel`.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Submodules
        run: |
          git submodule update --init external/titan_firmware
          git submodule update --init external/titan_firmware_rs
      - name: Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup target add thumbv6m-none-eabi
          # The firmware builds with the compiler titan_firmware_rs pins (its rust-toolchain.toml, read by rustup in
          # that directory): install it and its target, so the images are the same build as everyone else's
          if [ -f external/titan_firmware_rs/rust-toolchain.toml ]; then
            (cd external/titan_firmware_rs && rustup toolchain install)
            FW_TOOLCHAIN=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' external/titan_firmware_rs/rust-toolchain.toml)
            rustup target add thumbv6m-none-eabi --toolchain "$FW_TOOLCHAIN"
            (cd external/titan_firmware_rs/firmware && rustc --version)
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            external/titan_firmware_rs/firmware
      - name: Firmware images
        run: cd external/titan_firmware_rs/firmware && cargo build --workspace --release
      - name: Lint
        run: cargo clippy --workspace --all-targets --release -- -D warnings
      - name: Tests
        run: cargo test --release --workspace

  c-firmware:
    # The C titan_firmware programs the emulator runs (basic_template, the Titan bootloader, the OTA test app),
    # built against titan_firmware's pico-sdk, and the tests that boot them
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # pico-sdk's bundled pioasm and elf2uf2 projects ask for CMake < 3.5, which CMake 4 (on the runners since
      # 2025) refuses unless told the minimum policy version to assume
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - name: Submodules
        run: |
          git submodule update --init external/titan_firmware
          git -C external/titan_firmware submodule update --init --recursive
          # The emulator's workspace uses titan_firmware_rs's host crates (canmore, titan_link), so the tests need it
          # too (not its firmware images)
          git submodule update --init external/titan_firmware_rs
      # ARM GCC 13, as uwrt_nix pins it: the runners' apt package is GCC 14, which can't link the Titan bootloader
      # ("dangerous relocation: unsupported relocation" in boot_app.c)
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "13.3.Rel1"
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          arm-none-eabi-gcc --version | head -n 1
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - name: Build C firmware
        run: sh scripts/build_c_firmware.sh
      - name: Tests on C firmware
        run: cargo test --release -p sim_host --test pico_sdk --test flash --test can
