# Builds the emulator and the titan_firmware_rs images, then runs every test: the emulator's own, a smoke test for
# every board image, the robot, IVC link and sweep tests, and Puddles over UDP.
#
# external/titan_firmware_rs is the private repository ATK422/titan_firmware_rs: give the workflow a token that can
# read it as the repository secret TITAN_FIRMWARE_RS_TOKEN (a fine-grained token with "Contents: read" on that
# repository). Both jobs need it (the emulator's workspace uses its host crates). Without it the "firmware images"
# step fails loudly and the C job can't build the tests.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Submodules
        env:
          TOKEN: ${{ secrets.TITAN_FIRMWARE_RS_TOKEN }}
        run: |
          git submodule update --init external/titan_firmware
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          git submodule update --init external/titan_firmware_rs || echo "::warning::could not fetch external/titan_firmware_rs (set the TITAN_FIRMWARE_RS_TOKEN secret)"

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add thumbv6m-none-eabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            external/titan_firmware_rs/firmware

      - name: Firmware images
        run: |
          test -f external/titan_firmware_rs/firmware/Cargo.toml
          cd external/titan_firmware_rs/firmware && cargo build --workspace --release

      - name: Format and lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --release -- -D warnings
          python3 scripts/gen_boards.py --check

      - name: Tests
        run: cargo test --release --workspace -- --nocapture 2>&1 | tee test.log

      - name: Smoke test and sweep tables
        if: always()
        run: grep -E "^(board|[a-z_0-9]+ +[0-9n]|IVC| +[0-9]+ m )" test.log || true

  c-firmware:
    # The C titan_firmware programs the emulator runs (basic_template, the Titan bootloader, the OTA test app),
    # built against titan_firmware's pico-sdk, and the tests that boot them
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # pico-sdk's bundled pioasm and elf2uf2 projects ask for CMake < 3.5, which CMake 4 (on the runners since
      # 2025) refuses unless told the minimum policy version to assume
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - name: Submodules
        env:
          TOKEN: ${{ secrets.TITAN_FIRMWARE_RS_TOKEN }}
        run: |
          git submodule update --init external/titan_firmware
          git -C external/titan_firmware submodule update --init --recursive
          # The emulator's workspace uses titan_firmware_rs's host crates (canmore, titan_link), so the tests need it
          # too (not its firmware images)
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          git submodule update --init external/titan_firmware_rs || echo "::warning::could not fetch external/titan_firmware_rs (set the TITAN_FIRMWARE_RS_TOKEN secret)"
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build
      - uses: Swatinem/rust-cache@v2
      - name: Build C firmware
        run: sh scripts/build_c_firmware.sh
      - name: Tests on C firmware
        run: cargo test --release -p sim_host --test pico_sdk --test flash --test can
