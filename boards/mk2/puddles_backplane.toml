# Generated by scripts/gen_boards.py from titan_firmware lib/titan_boards/include/boards/mk2/puddles_backplane.h.
# Do not edit: put additions in boards/overlays/ instead.
name = "mk2/puddles_backplane"
mcu = "rp2040"
crystal_hz = 12_000_000
flash_size = 16777216

[debug_uart]
uart = 0
tx_pin = 16

[i2c_bus]
i2c = 1
sda_pin = 6
scl_pin = 7

# Pins named in the header
[pins]
board_scl_pin = 7
board_sda_pin = 6
eth_clk_pin = 2
eth_cs_pin = 1
eth_int_pin = 4
eth_miso_pin = 0
eth_mosi_pin = 3
eth_rst_pin = 5
rp2040_debug_tx_pin = 16
sensor_scl_pin = 9
sensor_sda_pin = 8
status_ledb_pin = 27
status_ledg_pin = 28
status_ledr_pin = 29
thruster_1_pin = 25
thruster_2_pin = 24
thruster_3_pin = 23
thruster_4_pin = 22
thruster_5_pin = 21
thruster_6_pin = 20
thruster_7_pin = 19
thruster_8_pin = 18

# ---- boards/overlays/mk2/puddles_backplane.toml
# The W5500 Ethernet controller on SPI0 (MISO 0, CS 1, SCK 2, MOSI 3), INTn on GPIO 4
[w5500]
bus = 0
cs = 1
int_pin = 4

# Sensor bus (I2C0, GPIO 8/9): the MS5837-30BA depth sensor outside the hull
[[i2c]]
bus = 0
device = "ms5837_30ba"
name = "depth"
depth_m = 0.0
temperature_c = 18.0

# Board bus (I2C1, GPIO 6/7): the MCP3426 rail monitor (the power board's dividers). The ADC128D818 at 0x2F is not
# modelled; the firmware only writes its configuration at boot and ignores failures.
[[i2c]]
bus = 1
device = "mcp3426"
channels = [
    { name = "rail_3v3", volts = 3.3, divider_ohms = [10_000, 10_000] },
    { name = "rail_balanced", volts = 16.0, divider_ohms = [10_000, 1_000] },
]

# Thrusters 1-8 on GPIO 25-18, bidirectional DShot300
[[dshot_esc]]
name = "t1"
signal_pin = 25
[[dshot_esc]]
name = "t2"
signal_pin = 24
[[dshot_esc]]
name = "t3"
signal_pin = 23
[[dshot_esc]]
name = "t4"
signal_pin = 22
[[dshot_esc]]
name = "t5"
signal_pin = 21
[[dshot_esc]]
name = "t6"
signal_pin = 20
[[dshot_esc]]
name = "t7"
signal_pin = 19
[[dshot_esc]]
name = "t8"
signal_pin = 18

# Physical kill switch sense (GPIO 12, pulled up on chip): the switch is inserted, pulling it low (vehicle enabled)
[[gpio]]
pin = 12
level = "low"
