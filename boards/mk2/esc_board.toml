# Generated by scripts/gen_boards.py from titan_firmware lib/titan_boards/include/boards/mk2/esc_board.h.
# Do not edit: put additions in boards/overlays/ instead.
name = "mk2/esc_board"
mcu = "rp2040"
crystal_hz = 12_000_000
flash_size = 2097152

[can]
bus = "internal"
client_id = 2

[[spi]]
bus = 0
cs = 17

[spi.mcp2517fd]
int_pin = 22
clkin_pin = 21
termination = true

[debug_uart]
uart = 0
tx_pin = 16

# Pins named in the header
[pins]
board_det_pin = 29
esc1_pwm_pin = 6
esc1_telem_pin = 7
esc2_pwm_pin = 4
esc2_telem_pin = 5
esc3_pwm_pin = 2
esc3_telem_pin = 3
esc4_pwm_pin = 0
esc4_telem_pin = 1
fault_led_pin = 13
mcp2517fd_canclk_pin = 21
mcp2517fd_int_pin = 22
mcp2517fd_miso_pin = 20
mcp2517fd_mosi_pin = 19
mcp2517fd_ncs_pin = 17
mcp2517fd_sck_pin = 18
rp2040_debug_tx_pin = 16
status_ledb_pin = 15
status_ledg_pin = 14
status_ledr_pin = 13
vcc_meas_pin = 28

# ---- boards/overlays/mk2/esc_board.toml
# Four bidirectional DShot600 ESCs (ESC1-4 on GPIO 6, 4, 2, 0; UART telemetry on GPIO 7, 5, 3, 1), 7 pole pairs.
# They are APD 80F3s with titan_firmware's 3D-mode patch (talos/ESCBoard/esc_firmware_patching: 48-1047 ahead and
# 1049-2047 astern on the same 0-1000 throttle scale) driving T200 thrusters. Their speed for a throttle is the bench
# fit the firmware's feed-forward was made from (titan_firmware ThrusterController.c, esc_core::controller::
# feed_forward; sim_devices::dshot::SpeedCurve::APD_T200): throttle step = c0 + c1 rpm + c2 rpm^2 at the steady state.
[[dshot_esc]]
name = "esc1"
signal_pin = 6
telemetry_pin = 7
throttle_fit = { forward = [12.369874, 0.103410, 0.000042], reverse = [14.791378, 0.098938, 0.000042] }

[[dshot_esc]]
name = "esc2"
signal_pin = 4
telemetry_pin = 5
throttle_fit = { forward = [12.369874, 0.103410, 0.000042], reverse = [14.791378, 0.098938, 0.000042] }

[[dshot_esc]]
name = "esc3"
signal_pin = 2
telemetry_pin = 3
throttle_fit = { forward = [12.369874, 0.103410, 0.000042], reverse = [14.791378, 0.098938, 0.000042] }

[[dshot_esc]]
name = "esc4"
signal_pin = 0
telemetry_pin = 1
throttle_fit = { forward = [12.369874, 0.103410, 0.000042], reverse = [14.791378, 0.098938, 0.000042] }

# ESC rail sense on GPIO 28 (ADC 2) behind 10k/1k; the board counts the ESCs as powered above 9 V
[[analog]]
adc = 2
name = "esc_vcc"
volts = 16.0
divider_ohms = [10_000, 1_000]

# Board detection: GPIO 29 low is ESC board 0 (thrusters 1-4)
[[gpio]]
pin = 29
level = "low"
