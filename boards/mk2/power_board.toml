# Generated by scripts/gen_boards.py from titan_firmware lib/titan_boards/include/boards/mk2/power_board.h.
# Do not edit: put additions in boards/overlays/ instead.
name = "mk2/power_board"
mcu = "rp2040"
crystal_hz = 12_000_000
flash_size = 2097152

[can]
bus = "internal"
client_id = 1

[[spi]]
bus = 0
cs = 17

[spi.mcp2517fd]
int_pin = 22
clkin_pin = 21
termination = true

[debug_uart]
uart = 0
tx_pin = 16

[i2c_bus]
i2c = 0
sda_pin = 4
scl_pin = 5

# Pins named in the header
[pins]
aux_switch_pin = 0
board_scl_pin = 5
board_sda_pin = 4
fan_switch_pin = 28
fan_tach_pin = 29
fault_led_pin = 13
mcp2517fd_canclk_pin = 21
mcp2517fd_int_pin = 22
mcp2517fd_miso_pin = 20
mcp2517fd_mosi_pin = 19
mcp2517fd_ncs_pin = 17
mcp2517fd_sck_pin = 18
phys_killswitch_pin = 1
port_meas_pin = 26
port_stat_pin = 11
rp2040_debug_tx_pin = 16
soft_killswitch_pin = 2
status_ledb_pin = 15
status_ledg_pin = 14
status_ledr_pin = 13
stbd_meas_pin = 27
stbd_stat_pin = 10

# ---- boards/overlays/mk2/power_board.toml
# Sensors on the board I2C bus (I2C0, GPIO 4/5) and the battery measurement inputs, with nominal values.
[[i2c]]
bus = 0
device = "sht41"
temperature_c = 30.0
humidity_rh = 35.0

# Rail monitor: 3.3 V rail behind 10k/10k on channel 1, the balanced battery rail behind 10k/1k on channel 2
[[i2c]]
bus = 0
device = "mcp3426"
channels = [
    { name = "rail_3v3", volts = 3.3, divider_ohms = [10_000, 10_000] },
    { name = "rail_balanced", volts = 16.0, divider_ohms = [10_000, 1_000] },
]

# Port and starboard battery measurement (GPIO 26/27) behind 10k/1k dividers
[[analog]]
adc = 0
name = "port_battery"
volts = 16.2
divider_ohms = [10_000, 1_000]

[[analog]]
adc = 1
name = "stbd_battery"
volts = 16.4
divider_ohms = [10_000, 1_000]

