# Generated by scripts/gen_boards.py from titan_firmware lib/titan_boards/include/boards/mk2/sbh_mcu.h.
# Do not edit: put additions in boards/overlays/ instead.
name = "mk2/sbh_mcu"
mcu = "rp2040"
crystal_hz = 12_000_000
flash_size = 2097152

[can]
bus = "external"
client_id = 1

[[spi]]
bus = 0
cs = 17

[spi.mcp2517fd]
int_pin = 22
clkin_pin = 21
termination = true

[debug_uart]
uart = 0
tx_pin = 16

# Pins named in the header
[pins]
bms_scl_pin = 6
bms_sda_pin = 7
bms_wake_pin = 8
fault_led_pin = 13
led_g_pin = 4
led_r_pin = 2
led_y_pin = 3
mcp2517fd_canclk_pin = 21
mcp2517fd_int_pin = 22
mcp2517fd_miso_pin = 20
mcp2517fd_mosi_pin = 19
mcp2517fd_ncs_pin = 17
mcp2517fd_sck_pin = 18
periph_scl_pin = 1
periph_sda_pin = 0
pwr_ctrl_pin = 9
rp2040_debug_tx_pin = 16
status_ledb_pin = 15
status_ledg_pin = 14
status_ledr_pin = 13
switch_signal_pin = 10

# ---- boards/overlays/mk2/sbh_mcu.toml
# Board I2C bus (I2C0, GPIO 0 SDA / 1 SCL): the pack's OLED and SHT41. The BQ40Z80 gauge is on GPIO 6/7, driven
# by a PIO SMBus (attached once PIO is modelled).
[[i2c]]
bus = 0
device = "sht41"
temperature_c = 24.0
humidity_rh = 50.0

[[i2c]]
bus = 0
device = "ssd1306"

# Board serial number (and CANmore client ID) in the last flash sector, as `smart_battery_id` programs it. It
# must match the gauge's serial number.
[[flash]]
address = 0x101F_F000
bytes = [21]
