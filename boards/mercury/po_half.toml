# Generated by scripts/gen_boards.py from titan_firmware lib/titan_boards/include/boards/mercury/po_half.h.
# Do not edit: put additions in boards/overlays/ instead.
name = "mercury/po_half"
mcu = "rp2040"
crystal_hz = 12_000_000
flash_size = 2097152

[can]
bus = "internal"
client_id = 1

[[spi]]
bus = 0
cs = 17

[spi.mcp2517fd]
int_pin = 22
clkin_pin = 21
termination = true

[debug_uart]
uart = 0
tx_pin = 16

[i2c_bus]
i2c = 0
sda_pin = 24
scl_pin = 25

# Pins named in the header
[pins]
aux_switch_pin = 3
board_scl_pin = 25
board_sda_pin = 24
fault_led_pin = 13
leak_detect_pin = 9
mcp2517fd_canclk_pin = 21
mcp2517fd_int_pin = 22
mcp2517fd_miso_pin = 20
mcp2517fd_mosi_pin = 19
mcp2517fd_ncs_pin = 17
mcp2517fd_sck_pin = 18
phys_killswitch_pin = 2
rp2040_debug_tx_pin = 16
soft_killswitch_pin = 4
solenoid_3_sw_pin = 1
status_ledb_pin = 15
status_ledg_pin = 14
status_ledr_pin = 13

# ---- boards/overlays/mercury/po_half.toml
# The board I2C bus (I2C0 on GPIO 24/25) "with temp sensor, adc, depth sensor" (boards/mercury/po_half.h): an
# MS5837-02BA water depth sensor, an SHT41 and an MCP3426 rail monitor. The C firmware (mercury/PoHalfBoard) starts
# only the depth sensor; its SHT41 and MCP3426 set-up is commented out, though it still publishes the MCP3426's
# channels as state/electrical.
[[i2c]]
bus = 0
device = "ms5837_02ba"
name = "depth"
depth_m = 0.0
temperature_c = 18.0

[[i2c]]
bus = 0
device = "sht41"
temperature_c = 30.0
humidity_rh = 35.0

# Channels as the firmware converts them (ros.c calc_actual_voltage: 3.3 V behind 10k/10k, the others 10k/1k)
[[i2c]]
bus = 0
device = "mcp3426"
channels = [
    { name = "rail_3v3", volts = 3.3, divider_ohms = [10_000, 10_000] },
    { name = "rail_balanced", volts = 16.0, divider_ohms = [10_000, 1_000] },
    { name = "rail_12v", volts = 12.0, divider_ohms = [10_000, 1_000] },
    { name = "rail_5v", volts = 5.0, divider_ohms = [10_000, 1_000] },
]
