# Four bidirectional DShot600 ESCs (ESC1-4 on GPIO 6, 4, 2, 0; UART telemetry on GPIO 7, 5, 3, 1), 7 pole pairs
[[dshot_esc]]
name = "esc1"
signal_pin = 6
telemetry_pin = 7

[[dshot_esc]]
name = "esc2"
signal_pin = 4
telemetry_pin = 5

[[dshot_esc]]
name = "esc3"
signal_pin = 2
telemetry_pin = 3

[[dshot_esc]]
name = "esc4"
signal_pin = 0
telemetry_pin = 1

# ESC rail sense on GPIO 28 (ADC 2) behind 10k/1k; the board counts the ESCs as powered above 9 V
[[analog]]
adc = 2
name = "esc_vcc"
volts = 16.0
divider_ohms = [10_000, 1_000]

# Board detection: GPIO 29 low is ESC board 0 (thrusters 1-4)
[[gpio]]
pin = 29
level = "low"
