# Board I2C bus (I2C0, GPIO 0 SDA / 1 SCL): the pack's OLED and SHT41
[[i2c]]
bus = 0
device = "sht41"
temperature_c = 24.0
humidity_rh = 50.0

[[i2c]]
bus = 0
device = "ssd1306"

# The pack's BQ40Z80 gauge on the SMBus the firmware runs on PIO (SDA GPIO 7, SCL GPIO 6), pulled up on the board.
# Its serial number must match the board's.
[[soft_i2c]]
sda = 7
scl = 6
device = "bq40z80"
name = "gauge"
serial = 21
voltage_mv = 16_400.0
current_ma = -2_500.0
soc_percent = 80.0
side_port = true

[[gpio]]
pin = 6
pull = "up"

[[gpio]]
pin = 7
pull = "up"

# Board serial number (and CANmore client ID) in the last flash sector, as `smart_battery_id` programs it. It
# must match the gauge's serial number.
[[flash]]
address = 0x101F_F000
bytes = [21]
