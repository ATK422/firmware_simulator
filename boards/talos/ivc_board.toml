# Generated by scripts/gen_boards.py from titan_firmware lib/titan_boards/include/boards/talos/ivc_board.h.
# Do not edit: put additions in boards/overlays/ instead.
name = "talos/ivc_board"
mcu = "rp2040"
crystal_hz = 12_000_000
flash_size = 2097152

[can]
bus = "internal"
client_id = 8

[[spi]]
bus = 0
cs = 17

[spi.mcp2517fd]
int_pin = 22
clkin_pin = 21
termination = true

[debug_uart]
uart = 0
tx_pin = 16

# Pins named in the header
[pins]
board_id_pin = 6
fault_led_pin = 13
mcp2517fd_canclk_pin = 21
mcp2517fd_int_pin = 22
mcp2517fd_miso_pin = 20
mcp2517fd_mosi_pin = 19
mcp2517fd_ncs_pin = 17
mcp2517fd_sck_pin = 18
output_select_pin = 3
rp2040_debug_tx_pin = 16
rx_pin = 26
status_ledb_pin = 15
status_ledg_pin = 14
status_ledr_pin = 13
tx_pin = 7

# ---- boards/overlays/talos/ivc_board.toml
# The IVC transducer (the plan's example numbers) and its receive chain. The hydrophone signal reaches ADC 1
# (GPIO 27) through one of two analog paths picked by GPIO 3: assumed here to be a 40-60 kHz band-pass (comms,
# GPIO 3 low) and a 60 kHz low-pass (GPIO 3 high, "low pass filtered transducer output" in the firmware).
[transducer]
tvr = { resonance_hz = 51_000, q = 8, peak_db = 140 }
rvs_db = -190
beam = "omni"

[transducer.drive]
pin = 7
supply_v = 12.0

[transducer.receive]
adc = 1
gain_db = 40
select_pin = 3
filters = [
    { highpass_hz = 40_000, lowpass_hz = 60_000, order = 4 },
    { lowpass_hz = 60_000, order = 4 },
]
