# Generated by scripts/gen_boards.py from titan_firmware lib/titan_boards/include/boards/lilboat/hbridge_board.h.
# Do not edit: put additions in boards/overlays/ instead.
name = "lilboat/hbridge_board"
mcu = "rp2040"
crystal_hz = 12_000_000
flash_size = 2097152

[can]
bus = "internal"
client_id = 2

[[spi]]
bus = 0
cs = 17

[spi.mcp2517fd]
int_pin = 22
clkin_pin = 21
termination = true

[debug_uart]
uart = 0
tx_pin = 16

# Pins named in the header
[pins]
drvoff_pin = 12
fault_led_pin = 13
h0en_pin = 1
h0ph_pin = 0
h1en_pin = 3
h1ph_pin = 2
h2en_pin = 5
h2ph_pin = 4
h3en_pin = 7
h3ph_pin = 6
h4en_pin = 9
h4ph_pin = 8
mcp2517fd_canclk_pin = 21
mcp2517fd_int_pin = 22
mcp2517fd_miso_pin = 20
mcp2517fd_mosi_pin = 19
mcp2517fd_ncs_pin = 17
mcp2517fd_sck_pin = 18
mp_data_pin = 26
mp_s0_pin = 23
mp_s1_pin = 28
mp_s2_pin = 29
nsleep_pin = 25
pump_sw_pin = 10
rp2040_debug_tx_pin = 16
servo_pin = 24
status_ledb_pin = 15
status_ledg_pin = 14
status_ledr_pin = 13

# ---- boards/overlays/lilboat/hbridge_board.toml
# The four DRV8243 bridges (H0, H1, H3, H4) share nSLEEP (GPIO 25) and DRVOFF (GPIO 12). The nFAULT lines of H0,
# H1 and H3 reach ADC 0 (GPIO 26) through a CD74HC4051 mux (select GPIO 23, 28, 29; inputs 0-2), H4's is GPIO 11.
[[analog]]
adc = 0
name = "mux"
mux = { select_pins = [23, 28, 29], inputs = [
    { volts = 3.3, name = "h0.nfault_v" },
    { volts = 3.3, name = "h1.nfault_v" },
    { volts = 3.3, name = "h3.nfault_v" },
] }

[[drv8243]]
nsleep_pin = 25
drvoff_pin = 12
bridges = [
    { nfault_input = "h0.nfault_v" },
    { nfault_input = "h1.nfault_v" },
    { nfault_input = "h3.nfault_v" },
    { nfault_pin = 11 },
]
