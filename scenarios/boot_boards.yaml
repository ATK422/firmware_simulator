# The board images that are not part of Talos (boot_talos.yaml has those), each on its board file next to a mock
# titan_bridge for its CANmore client: it connects, reports its identity with no fault raised, keeps its link up and
# does not panic. One YAML document per board; `scenario` runs them side by side.
name: power_board boots and connects
board: {image: power_board, file: mk2/power_board}
bridges: [1]
time: 2.5s
steps:
  - expect: {log: ROS connected, within: 1s}
  - expect: {status: {board_name: mk2/power_board, client_id: 1, faults: 0}, at: 2.5s}
  - expect: {link: up, at: 2.5s}
  - never: {log: PANIC}
  - always: {resets: 0}

