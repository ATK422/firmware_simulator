---
name: Puddles backplane boots and connects over Ethernet
robot: robots/puddles.toml
bridges: [eth:backplane]
time: 2.5s
steps:
  - expect: {board: backplane, log: ROS connected, within: 2s}
  - expect: {board: backplane, status: {board_name: mk2/puddles_backplane, faults: 0}, at: 2.5s}
  - expect: {board: backplane, link: up, at: 2.5s}
  - never: {board: backplane, log: PANIC}
