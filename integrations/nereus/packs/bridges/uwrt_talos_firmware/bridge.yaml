- id: actuator_status
  direction: publish
  topic: simulator/nereus/state/actuator/status
  message_type: riptide_msgs2/msg/ActuatorStatus
  native: state:mechanisms
  frame_id: ''
  rate_hz: 50
  qos:
    history: keep_last
    depth: 10
    reliability: reliable
    durability: volatile
  fields:
    actuators_armed:
      from: armed
    claw_state:
      from: claw.state
      enum_map:
        disarmed: 1
        opening: 6
        closing: 7
        opened: 3
        closed: 4
    rack_state:
      constant: 2
    torpedo_state:
      from: torpedo_launcher.state
      enum_map:
        disarmed: 1
        busy: 4
        loaded: 3
        empty: 5
    torpedo_available_count:
