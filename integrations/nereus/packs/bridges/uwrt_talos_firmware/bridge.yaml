- id: imu
  direction: publish
  topic: vectornav/imu
  message_type: sensor_msgs/msg/Imu
  native: sensor:imu
  frame_id: talos/imu_link
  rate_hz: 400
  qos:
    history: keep_last
    depth: 10
    reliability: reliable
    durability: volatile
  fields:
    header.stamp:
      from: sample.time
    orientation.w:
      from: reading.attitude.orientation_wxyz[0]
    orientation.x:
      from: reading.attitude.orientation_wxyz[1]
    orientation.y:
      from: reading.attitude.orientation_wxyz[2]
    orientation.z:
      from: reading.attitude.orientation_wxyz[3]
    orientation_covariance:
      from: reading.attitude.covariance
    angular_velocity:
      from: reading.inertial.angular_velocity
    angular_velocity_covariance:
      from: reading.inertial.angular_covariance
    linear_acceleration:
      from: reading.inertial.specific_force
    linear_acceleration_covariance:
      from: reading.inertial.force_covariance
- id: fog
  direction: publish
  topic: gyro/twist
  message_type: geometry_msgs/msg/TwistWithCovarianceStamped
  native: sensor:fog
  frame_id: talos/fog_link
  rate_hz: 500
  qos:
    history: keep_last
    depth: 10
    reliability: reliable
    durability: volatile
  fields:
    header.stamp:
      from: sample.time
    twist.twist.angular.z:
      from: reading.angular_rates[0]
    twist.covariance[35]:
      from: reading.covariance[0][0]
- id: dvl
  direction: publish
  topic: dvl_twist
  message_type: geometry_msgs/msg/TwistWithCovarianceStamped
  native: sensor:dvl
  frame_id: talos/dvl_link
  rate_hz: 8
  qos:
    history: keep_last
    depth: 10
    reliability: reliable
    durability: volatile
  fields:
    header.stamp:
      from: sample.time
    twist.twist.linear:
      from: reading.reference_relative_velocity
    twist.covariance[0]:
      from: reading.covariance[0][0]
    twist.covariance[7]:
      from: reading.covariance[1][1]
    twist.covariance[14]:
      from: reading.covariance[2][2]
- id: firmware_kill
