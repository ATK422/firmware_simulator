  qos:
    history: keep_last
    depth: 1
    reliability: reliable
    durability: transient_local
  fields: {}
services:
- id: set_sim_pose
  service: set_sim_pose
  service_type: robot_localization/srv/SetPose
  action: command:robot.place
  request:
    frame:
      from: pose.header.frame_id
    position_m:
      from: pose.pose.pose.position
    orientation_w:
      from: pose.pose.pose.orientation.w
    orientation_x:
      from: pose.pose.pose.orientation.x
    orientation_y:
      from: pose.pose.pose.orientation.y
    orientation_z:
      from: pose.pose.pose.orientation.z
  response: {}
  placement:
    pose_source: request
    keep_velocity: false
    becomes_start_pose: true
    align_estimator: true
- id: sync_sim_to_estimate
  service: sync_sim_to_estimate
  service_type: std_srvs/srv/Trigger
  action: command:robot.place
  request: {}
  response:
    success:
      from: accepted
    message:
      from: message
  placement:
    pose_source: estimate
    keep_velocity: true
    becomes_start_pose: false
