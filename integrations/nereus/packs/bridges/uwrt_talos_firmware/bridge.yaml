      from: data
  reply_stream: actuator_cmd_status
- id: claw_timed_move
  direction: subscribe
  topic: command/actuator/claw_move_s
  message_type: std_msgs/msg/Float32
  native: command:mechanisms.claw.timed_move
  frame_id: ''
