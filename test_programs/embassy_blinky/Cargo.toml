[package]
name = "embassy_blinky"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Emulator test firmware: toggles GPIO 25 every 250 ms with embassy-time and logs over defmt"
publish = false

# Standalone: built for thumbv6m-none-eabi, not part of the emulator workspace
[workspace]

[dependencies]
cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-rp = { version = "0.10.0", features = ["rp2040", "defmt", "time-driver", "critical-section-impl", "intrinsics", "boot2-w25q080"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = "0.8.0"

[profile.release]
debug = 2
lto = "fat"
opt-level = "s"
codegen-units = 1
