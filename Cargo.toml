[workspace]
resolver = "3"
members = [".", "crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
sim_core = { path = "crates/sim_core" }
cpu_armv6m = { path = "crates/cpu_armv6m" }
rp2040 = { path = "crates/rp2040" }
sim_devices = { path = "crates/sim_devices" }
sim_acoustics = { path = "crates/sim_acoustics" }
sim_physics = { path = "crates/sim_physics" }
sim_host = { path = "crates/sim_host" }
sim_test = { path = "crates/sim_test" }
sim_calib = { path = "crates/sim_calib" }
log = "0.4"
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "std"] }
anyhow = "1"
thiserror = "2"

[package]
name = "firmware_simulator"
description = "RP2040 emulator for UWRT titan firmware"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sim_core.workspace = true
rp2040.workspace = true
sim_host.workspace = true
sim_devices.workspace = true
sim_acoustics.workspace = true
sim_physics.workspace = true
sim_test.workspace = true
sim_calib.workspace = true
log.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
# Already in the dependency tree (sim_host, env_logger): the MCP server's JSON-RPC, log filters, and killing its
# children with it
serde_json = "1"
regex = "1"
libc = "0.2"

[dev-dependencies]
# Already in the dependency tree (sim_host): reading the calibration outputs in tests
toml = "0.8"
# CANmore ids in the host tool tests
canmore = { path = "external/titan_firmware_rs/crates/canmore" }

[profile.release]
debug = 1

# The fastest emulator (docs/internals.md, "Performance"): `cargo build --profile fast`, binaries in `target/fast/`.
# Whole-program LTO in one codegen unit runs the bench 3-7 % faster than release, but takes twice as long to build
# from clean and redoes the LTO on every link, so release (which the test suite uses) stays without it.
# `scripts/build_pgo.sh` builds this profile trained on the bench.
[profile.fast]
inherits = "release"
debug = false
lto = "fat"
codegen-units = 1

[profile.dev]
# The interpreter is unusably slow unoptimised; keep debug info but optimise
opt-level = 1

[profile.test]
opt-level = 1
