[package]
name = "sim_host"
description = "Host bridges: SocketCAN, UDP, GDB remote protocol, RTT/defmt, UART pty"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sim_core.workspace = true
cpu_armv6m.workspace = true
rp2040.workspace = true
log.workspace = true
defmt-decoder = "1.2"
object.workspace = true
# Already in the dependency tree through defmt-decoder: reads .debug_frame for the profiler's stack walks
gimli = { version = "0.29", default-features = false, features = ["read"] }
thiserror.workspace = true
libc = "0.2"
sim_devices.workspace = true
sim_acoustics.workspace = true
sim_physics.workspace = true
# The real protocol crates from titan_firmware_rs, so the mock bridge speaks exactly what titan_bridge speaks
canmore = { path = "../../external/titan_firmware_rs/crates/canmore" }
titan_link = { path = "../../external/titan_firmware_rs/crates/titan_link" }
serde = { version = "1", features = ["derive"] }
# Already in the dependency tree through defmt-decoder: the dashboard's JSON
serde_json = "1"
toml = "0.8"
