[package]
name = "cpu_armv6m"
description = "Cortex-M0+ (ARMv6-M) interpreter with NVIC, SysTick and SCB"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sim_core.workspace = true
log.workspace = true

# The JIT (`jit` module): only where Cranelift generates code; elsewhere the core interprets
[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
cranelift-codegen = "0.137.1"
cranelift-frontend = "0.137.1"
cranelift-jit = "0.137.1"
cranelift-module = "0.137.1"
cranelift-native = "0.137.1"
