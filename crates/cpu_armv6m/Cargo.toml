[package]
name = "cpu_armv6m"
description = "Cortex-M0+ (ARMv6-M) interpreter with NVIC, SysTick and SCB"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sim_core.workspace = true
log.workspace = true

[features]
default = ["jit"]
# The JIT (`jit` module), with Cranelift: only where Cranelift generates code (x86-64, aarch64). Without it, or
# elsewhere, the core interprets
jit = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native"]

[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
cranelift-codegen = { version = "0.137.1", optional = true }
cranelift-frontend = { version = "0.137.1", optional = true }
cranelift-jit = { version = "0.137.1", optional = true }
cranelift-module = { version = "0.137.1", optional = true }
cranelift-native = { version = "0.137.1", optional = true }
