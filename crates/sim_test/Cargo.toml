[package]
name = "sim_test"
description = "Firmware integration test harness"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["jit"]
# The Cranelift JIT for the cores (the bench's `--jit`)
jit = ["cpu_armv6m/jit"]

[dependencies]
sim_core.workspace = true
rp2040.workspace = true
cpu_armv6m.workspace = true
sim_host.workspace = true
sim_devices.workspace = true
sim_acoustics.workspace = true
sim_physics.workspace = true
log.workspace = true
toml = "0.8"
serde = { version = "1", features = ["derive"] }
# Scenario files (YAML) and their JSON output; regex for log line patterns. serde_json and regex are already in
# the dependency tree
serde_yaml = "0.9"
serde_json = "1"
regex = "1"
canmore = { path = "../../external/titan_firmware_rs/crates/canmore" }
titan_link = { path = "../../external/titan_firmware_rs/crates/titan_link" }

