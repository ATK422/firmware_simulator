# Puddles, UWRT's small test vehicle, for the vehicle simulation (`sim_physics`).
#
# ASSUMED NUMBERS: Puddles is taken to be a BlueROV2 Heavy-sized vehicle (eight T200 thrusters, four vectored
# horizontal and four vertical). The mass, inertia, added mass and drag are the BlueROV2 Heavy's as identified in
# the literature (e.g. von Benzon et al., "An Open-Source Benchmark Simulator: Control of a BlueROV2 Underwater
# Robot", JMSE 2022), rounded, with small linear terms added where the identification found none; the thruster
# positions are the BlueROV2 Heavy frame's, except that the horizontal thrusters' line of thrust is taken through
# the centre of gravity (8.5 cm below it, as in that frame, the 13 kg vehicle would pitch tens of degrees at full
# thrust against its small righting moment). None of it was measured on Puddles.
#
# Frames: body x forward, y starboard, z down, from the centre of gravity (m). Thruster `direction` is the way it
# pushes the vehicle at positive RPM.
name = "puddles"

mass_kg = 13.5
# 1 N of net buoyancy in fresh water
volume_m3 = 0.0136429
inertia_kg_m2 = [0.26, 0.23, 0.37]
# Buoyancy (the foam on top) 3 cm above the weight
cob_m = [0.0, 0.0, -0.03]
height_m = 0.34
added_mass = [6.4, 7.1, 18.7, 0.19, 0.14, 0.22]
linear_drag = [13.7, 5.0, 33.0, 0.3, 0.8, 0.5]
quadratic_drag = [141.0, 217.0, 190.0, 1.2, 0.5, 1.5]
# The potential-flow Munk moment would pitch it over at speed (its heave added mass is three times the surge one);
# an open frame sheds the flow and feels much less of it
munk_moment_scale = 0.25

# T200 at 16 V, Blue Robotics' published data (T200-Public-Performance-Data-10-20V-September-2019.xlsx): a
# k rpm|rpm| fit per direction to its 16 V sheet, 4.07e-6 N/RPM^2 ahead (51.4 N measured at its top speed, 3533
# RPM) and 3.25e-6 astern (39.9 N at 3465 RPM); within 8% of the sheet from 5 N up
thruster_model = { forward_n = 50.82, reverse_n = 40.53, at_rpm = 3533.0 }

# Thrusters 1-4 (backplane GPIO 25-22): horizontal, at 45 degrees, all four ahead drive it forward; the starboard
# pair (1, 3) ahead and the port pair (2, 4) astern turn it to port
[[thruster]]
name = "t1"
position_m = [0.156, 0.111, 0.0]
direction = [1.0, -1.0, 0.0]

[[thruster]]
name = "t2"
position_m = [0.156, -0.111, 0.0]
direction = [1.0, 1.0, 0.0]

[[thruster]]
name = "t3"
position_m = [-0.156, 0.111, 0.0]
direction = [1.0, 1.0, 0.0]

[[thruster]]
name = "t4"
position_m = [-0.156, -0.111, 0.0]
direction = [1.0, -1.0, 0.0]

# Thrusters 5-8 (GPIO 21-18): vertical; positive RPM pushes the vehicle down (dives)
[[thruster]]
name = "t5"
position_m = [0.12, 0.218, 0.0]
direction = [0.0, 0.0, 1.0]

[[thruster]]
name = "t6"
position_m = [0.12, -0.218, 0.0]
direction = [0.0, 0.0, 1.0]

[[thruster]]
name = "t7"
position_m = [-0.12, 0.218, 0.0]
direction = [0.0, 0.0, 1.0]

[[thruster]]
name = "t8"
position_m = [-0.12, -0.218, 0.0]
direction = [0.0, 0.0, 1.0]
